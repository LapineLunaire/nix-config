name: Update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: flake-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: nixos
    env:
      # Update server inputs separately so failures in the other inputs do not hold them back.
      SERVER_INPUTS: nixpkgs-stable home-manager-stable nixvim-stable microvm unifi-os-server
      CHECK: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
      HA_FILE: hosts/sparkle/guests/homeassistant/default.nix
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs include commits pushed by the previous update.
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Configure Nix caches
        uses: ./.forgejo/actions/configure-nix

      - name: Update Home Assistant digest
        id: ha
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$(date +%u)" != "1" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "not Monday, skipping"
            exit 0
          fi
          ha=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/home-assistant/home-assistant:stable)

          if [[ ! "$ha" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid container digest: $ha" >&2
            exit 1
          fi

          sed -i "s|home-assistant/home-assistant@sha256:[a-f0-9]*|home-assistant/home-assistant@${ha}|" "$HA_FILE"
          # sed succeeds when nothing matches.
          if ! grep -Fq "home-assistant/home-assistant@${ha}" "$HA_FILE"; then
            echo "$HA_FILE does not pin the Home Assistant image by digest" >&2
            exit 1
          fi

      - name: Revert Home Assistant digest
        id: ha-revert
        if: steps.ha.outcome == 'failure'
        run: git checkout -- "$HA_FILE"

      - name: List flake inputs
        id: inputs
        run: |
          set -euo pipefail
          names=$(nix eval --impure --raw --expr 'builtins.concatStringsSep " " (builtins.attrNames (builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.root.inputs)')
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Update server inputs
        id: server
        continue-on-error: true
        env:
          INPUT_NAMES: ${{ steps.inputs.outputs.names }}
        run: |
          set -euo pipefail
          read -ra inputs <<< "$SERVER_INPUTS"
          # nix flake update only warns about a name that is not an input.
          for input in "${inputs[@]}"; do
            case " $INPUT_NAMES " in
              *" $input "*) ;;
              *)
                echo "SERVER_INPUTS names $input, which is not a flake input" >&2
                exit 1
                ;;
            esac
          done
          nix flake update "${inputs[@]}"
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # This build checks the hash only because no cache holds the plugin source; keep it out of the caches.
      - name: Refresh the caddy plugin hash
        id: caddy
        if: steps.server.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if err=$(nix build --no-link .#nixosConfigurations.proxy.config.services.caddy.package.src 2>&1); then
            exit 0
          fi
          got=$(printf '%s\n' "$err" | sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]\{1,\}\).*/\1/p' | head -1)
          if [[ ! "$got" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            printf '%s\n' "$err" >&2
            exit 1
          fi
          # Match the line the way the server upgrade check does, so it accepts the change.
          old=$(sed -n 's|^      hash = "\(sha256-[A-Za-z0-9+/]\{43\}=\)";$|\1|p' modules/nixos/services/caddy.nix)
          if [[ ! "$old" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "modules/nixos/services/caddy.nix does not hold exactly one plugin hash line" >&2
            exit 1
          fi
          sed -i "s|^      hash = \"$old\";\$|      hash = \"$got\";|" modules/nixos/services/caddy.nix
          echo "caddy plugin hash refreshed: $old -> $got"

      - name: Check server inputs
        id: server-check
        if: steps.server.outputs.changed == 'true' && steps.caddy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          $CHECK
          nix build --no-link .#nixosConfigurations.sparkle.config.system.build.toplevel

      - name: Revert server inputs
        id: server-revert
        if: steps.server.outcome == 'failure' || (steps.server.outputs.changed == 'true' && steps.server-check.outcome != 'success')
        run: git checkout -- flake.lock modules/nixos/services/caddy.nix

      # Builds can write to the temporary directory, so keep the checked lock file in the repository's object store.
      - name: Save checked lock file
        id: saved
        run: echo "lock=$(git hash-object -w --no-filters flake.lock)" >> "$GITHUB_OUTPUT"

      - name: Update remaining inputs
        id: rest
        continue-on-error: true
        env:
          INPUT_NAMES: ${{ steps.inputs.outputs.names }}
          SAVED_LOCK: ${{ steps.saved.outputs.lock }}
        run: |
          set -euo pipefail
          read -ra all_inputs <<< "$INPUT_NAMES"
          inputs=()
          for input in "${all_inputs[@]}"; do
            case " $SERVER_INPUTS " in
              *" $input "*) ;;
              *) inputs+=("$input") ;;
            esac
          done
          # nix flake update with no names updates every input.
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nix flake update "${inputs[@]}"
          if [ "$(git hash-object --no-filters flake.lock)" = "$SAVED_LOCK" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check remaining inputs
        id: rest-check
        if: steps.rest.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          $CHECK
          for host in sparkle camellya kafka; do
            nix build --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      - name: Revert remaining inputs
        id: rest-revert
        if: steps.rest.outcome == 'failure' || (steps.rest.outputs.changed == 'true' && steps.rest-check.outcome != 'success')
        env:
          SAVED_LOCK: ${{ steps.saved.outputs.lock }}
        run: git cat-file blob "$SAVED_LOCK" > flake.lock

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- flake.lock modules/nixos/services/caddy.nix "$HA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Check the combined result, which also covers a Home Assistant digest change on its own.
      - name: Check flake outputs
        if: steps.check.outputs.changed == 'true'
        run: $CHECK

      # The servers run the same check and refuse a commit that fails it until a trusted commit follows.
      # The commit is still pushed, so that it can be reviewed and accepted.
      - name: Check the lock file as the servers will
        id: lock-check
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          jq -e -n --slurpfile old <(git show HEAD:flake.lock) --slurpfile new flake.lock \
            -f modules/nixos/nix/ci-lock-check.jq > /dev/null

      # Sparkle includes every guest runner. Sparxie is only evaluated, by $CHECK.
      # Accepted remaining inputs were already built with the desktops, so a desktop that fails here
      # also fails without this update and does not hold it back.
      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sparkle=$(nix build --no-link --print-out-paths .#nixosConfigurations.sparkle.config.system.build.toplevel)
          echo "sparkle=$sparkle" >> "$GITHUB_OUTPUT"
          failed=
          for host in camellya kafka; do
            if out=$(nix build --no-link --print-out-paths ".#nixosConfigurations.$host.config.system.build.toplevel"); then
              echo "$host=$out" >> "$GITHUB_OUTPUT"
            else
              failed="$failed $host"
            fi
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"

      - name: Push to the cache
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/attic-push
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          server-paths: ${{ steps.build.outputs.sparkle }}
          desktop-paths: |
            ${{ steps.build.outputs.camellya }}
            ${{ steps.build.outputs.kafka }}

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: |
            flake.lock
            modules/nixos/services/caddy.nix
            hosts/sparkle/guests/homeassistant/default.nix
          message: "flake: update dependencies"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}

      - name: Report problems
        if: >-
          steps.ha-revert.outcome == 'success' || steps.server-revert.outcome == 'success'
          || steps.rest-revert.outcome == 'success' || steps.lock-check.outcome == 'failure'
          || steps.build.outputs.failed != ''
        env:
          HA_REVERTED: ${{ steps.ha-revert.outcome == 'success' }}
          SERVER_REVERTED: ${{ steps.server-revert.outcome == 'success' }}
          REST_REVERTED: ${{ steps.rest-revert.outcome == 'success' }}
          LOCK_REFUSED: ${{ steps.lock-check.outcome == 'failure' }}
          BUILD_FAILED: ${{ steps.build.outputs.failed }}
        run: |
          if [ "$HA_REVERTED" = "true" ]; then
            echo "The Home Assistant digest was not updated" >&2
          fi
          if [ "$SERVER_REVERTED" = "true" ]; then
            echo "Server inputs were not updated" >&2
          fi
          if [ "$REST_REVERTED" = "true" ]; then
            echo "Remaining inputs were not updated" >&2
          fi
          if [ "$LOCK_REFUSED" = "true" ]; then
            echo "The servers will refuse the pushed commit until a trusted commit follows it; see docs/updates.md" >&2
          fi
          if [ -n "$BUILD_FAILED" ]; then
            echo "Not built or cached: $BUILD_FAILED" >&2
          fi
          exit 1
