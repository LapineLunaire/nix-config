name: Update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: flake-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs include commits pushed by the previous update.
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Update and build
        id: update
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash .forgejo/ci.sh update

      - name: Push to the cache
        if: steps.update.outputs.publish == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          STORE_PATHS: ${{ steps.update.outputs.paths }}
        run: |
          set -euo pipefail
          : "${ATTIC_TOKEN:?ATTIC_TOKEN is missing, so the cache cannot be filled}"
          mapfile -t paths < <(printf '%s\n' "$STORE_PATHS" | sed '/^[[:space:]]*$/d')
          [ "${#paths[@]}" -gt 0 ] || { echo "No store paths to upload" >&2; exit 1; }
          # Protect Attic's cleartext token and remove it even on failure.
          umask 077
          export XDG_CONFIG_HOME
          XDG_CONFIG_HOME=$(mktemp -d "$RUNNER_TEMP/attic-config.XXXXXX")
          trap 'rm -rf -- "$XDG_CONFIG_HOME"' EXIT
          # attic login only takes the token as an argument, which other processes can read.
          mkdir "$XDG_CONFIG_HOME/attic"
          printf '%s' "$ATTIC_TOKEN" > "$XDG_CONFIG_HOME/attic/token"
          unset ATTIC_TOKEN
          printf '[servers.lunaire]\nendpoint = "https://cache.lunaire.moe/"\ntoken-file = "%s"\n' \
            "$XDG_CONFIG_HOME/attic/token" > "$XDG_CONFIG_HOME/attic/config.toml"
          attic push --ignore-upstream-cache-filter lunaire:lune "${paths[@]}"

      - name: Commit and push
        if: steps.update.outputs.publish == 'true'
        env:
          SSH_SIGNING_KEY: ${{ secrets.CI_SIGNING_KEY }}
          MESSAGE: "flake: update dependencies"
          PUSH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          FILES: ${{ steps.update.outputs.files }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp "$RUNNER_TEMP/commit-signing-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SSH_SIGNING_KEY" > "$key"
          unset SSH_SIGNING_KEY
          mapfile -t files < <(printf '%s\n' "$FILES" | sed '/^[[:space:]]*$/d')

          git --literal-pathspecs \
            -c user.name=Carmilla -c user.email=carmilla@lunaire.eu \
            -c gpg.format=ssh -c user.signingkey="$key" -c commit.gpgsign=true \
            commit --only -m "$MESSAGE $(date +%Y-%m-%d)" -- "${files[@]}"

          # The checks ran on this checkout, and Git refuses the push if the branch moved since then.
          # Keep the push token out of the checkout and argv.
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0="http.${SERVER_URL%/}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')" \
            git push

      # Also after a failed upload or push.
      - name: Report problems
        if: always() && steps.update.outputs.problems != ''
        env:
          PROBLEMS: ${{ steps.update.outputs.problems }}
        run: |
          printf '%s\n' "$PROBLEMS" >&2
          exit 1
