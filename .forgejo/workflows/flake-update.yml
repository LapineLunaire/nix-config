name: Update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: flake-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: nixos
    env:
      # Update server-only inputs separately so a failed update of the other inputs does not hold them back.
      SERVER_INPUTS: nixpkgs-stable home-manager-stable nixvim-stable microvm unifi-os-server
      CHECK: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Queued runs include commits pushed by the previous update.
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Configure Nix caches
        uses: ./.forgejo/actions/configure-nix

      - name: Update Home Assistant digest
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$(date +%u)" != "1" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "not Monday, skipping"
            exit 0
          fi
          set -euo pipefail
          ha=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/home-assistant/home-assistant:stable)

          if [[ ! "$ha" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid container digest: $ha" >&2
            exit 1
          fi

          sed -i "s|home-assistant/home-assistant@sha256:[a-f0-9]*|home-assistant/home-assistant@${ha}|" hosts/sparkle/guests/homeassistant/default.nix

      - name: Update server inputs
        id: server
        continue-on-error: true
        run: |
          set -euo pipefail
          read -ra inputs <<< "$SERVER_INPUTS"
          nix flake update "${inputs[@]}"
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Jobs start with an empty store, and no cache holds the plugin source, so this build always checks the hash.
      - name: Refresh the caddy plugin hash
        id: caddy
        if: steps.server.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if err=$(nix build --no-link .#nixosConfigurations.proxy.config.services.caddy.package.src 2>&1); then
            exit 0
          fi
          got=$(printf '%s\n' "$err" | sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]\{1,\}\).*/\1/p' | head -1)
          if [ -z "$got" ]; then
            printf '%s\n' "$err" >&2
            exit 1
          fi
          old=$(sed -n 's/^ *hash = "\(sha256-[^"]*\)";$/\1/p' modules/nixos/services/caddy.nix | head -1)
          if [[ ! "$old" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "Cannot identify the current Caddy plugin hash" >&2
            exit 1
          fi
          sed -i "s|\"$old\"|\"$got\"|" modules/nixos/services/caddy.nix
          echo "caddy plugin hash refreshed: $old -> $got"

      - name: Check server inputs
        id: server-check
        if: steps.server.outputs.changed == 'true' && steps.caddy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          $CHECK
          nix build --no-link .#nixosConfigurations.sparkle.config.system.build.toplevel

      - name: Revert server inputs
        id: server-revert
        if: steps.server.outcome == 'failure' || (steps.server.outputs.changed == 'true' && steps.server-check.outcome != 'success')
        run: git checkout -- flake.lock modules/nixos/services/caddy.nix

      - name: Save checked lock file
        run: cp flake.lock "$RUNNER_TEMP/flake.lock"

      - name: Update remaining inputs
        id: rest
        continue-on-error: true
        run: |
          set -euo pipefail
          input_names=$(nix eval --impure --raw --expr 'builtins.concatStringsSep " " (builtins.attrNames (builtins.fromJSON (builtins.readFile ./flake.lock)).nodes.root.inputs)')
          read -ra all_inputs <<< "$input_names"
          inputs=()
          for input in "${all_inputs[@]}"; do
            case " $SERVER_INPUTS " in
              *" $input "*) ;;
              *) inputs+=("$input") ;;
            esac
          done
          # nix flake update with no names updates every input.
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nix flake update "${inputs[@]}"
          if cmp -s flake.lock "$RUNNER_TEMP/flake.lock"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Shared inputs also affect sparkle.
      - name: Check remaining inputs
        id: rest-check
        if: steps.rest.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          $CHECK
          for host in sparkle camellya kafka; do
            nix build --no-link ".#nixosConfigurations.$host.config.system.build.toplevel"
          done

      - name: Revert remaining inputs
        id: rest-revert
        if: steps.rest.outcome == 'failure' || (steps.rest.outputs.changed == 'true' && steps.rest-check.outcome != 'success')
        run: cp "$RUNNER_TEMP/flake.lock" flake.lock

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- flake.lock modules/nixos/services/caddy.nix hosts/sparkle/guests/homeassistant/default.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Checks the combined result, and a Home Assistant digest change on its own.
      - name: Check flake outputs
        if: steps.check.outputs.changed == 'true'
        run: $CHECK

      # Sparkle includes every guest runner. The ARM VPS is evaluated above.
      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sparkle=$(nix build --no-link --print-out-paths .#nixosConfigurations.sparkle.config.system.build.toplevel)
          camellya=$(nix build --no-link --print-out-paths .#nixosConfigurations.camellya.config.system.build.toplevel)
          kafka=$(nix build --no-link --print-out-paths .#nixosConfigurations.kafka.config.system.build.toplevel)
          {
            echo "sparkle=$sparkle"
            echo "camellya=$camellya"
            echo "kafka=$kafka"
          } >> "$GITHUB_OUTPUT"

      - name: Push to the cache
        if: steps.check.outputs.changed == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          SPARKLE_PATH: ${{ steps.build.outputs.sparkle }}
          CAMELLYA_PATH: ${{ steps.build.outputs.camellya }}
          KAFKA_PATH: ${{ steps.build.outputs.kafka }}
        run: |
          set -euo pipefail
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "ATTIC_TOKEN not set, skipping push"
            exit 0
          fi
          # Attic stores its token in cleartext. Restrict access and remove it on success or failure.
          umask 077
          export XDG_CONFIG_HOME
          XDG_CONFIG_HOME=$(mktemp -d "$RUNNER_TEMP/attic-config.XXXXXX")
          trap 'rm -rf -- "$XDG_CONFIG_HOME"' EXIT
          attic login lunaire https://cache.lunaire.moe/ "$ATTIC_TOKEN"
          unset ATTIC_TOKEN
          attic push --ignore-upstream-cache-filter lunaire:server "$SPARKLE_PATH"
          attic push --ignore-upstream-cache-filter lunaire:desktop "$CAMELLYA_PATH" "$KAFKA_PATH"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: |
            flake.lock
            modules/nixos/services/caddy.nix
            hosts/sparkle/guests/homeassistant/default.nix
          message: "flake: update dependencies"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}

      - name: Report reverted inputs
        if: steps.server-revert.outcome == 'success' || steps.rest-revert.outcome == 'success'
        env:
          SERVER_REVERTED: ${{ steps.server-revert.outcome == 'success' }}
          REST_REVERTED: ${{ steps.rest-revert.outcome == 'success' }}
        run: |
          if [ "$SERVER_REVERTED" = "true" ]; then
            echo "Server inputs were not updated" >&2
          fi
          if [ "$REST_REVERTED" = "true" ]; then
            echo "Remaining inputs were not updated" >&2
          fi
          exit 1
