name: Validate

# The update workflow pushes with the workflow token, which starts no workflows; it checks and builds the same systems
# before it pushes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only the newest commit on main deploys, so older runs are cancelled.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Nix caches
        uses: ./.forgejo/actions/configure-nix

      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false

      # The update workflow rewrites these values, and the servers accept a CI commit only where the pattern matches.
      - name: Check the values CI may change
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016
          pins=$(nix eval --raw --no-write-lock-file .#nixosConfigurations.sparkle.config.host.autoUpdate.ciPins \
            --apply 'pins: builtins.concatStringsSep "" (map (path: "${path}\t${pins.${path}}\n") (builtins.attrNames pins))')
          while IFS=$'\t' read -r path pattern; do
            [ -n "$path" ] || continue
            count=$(grep -cE -- "$pattern" "$path" || true)
            if [ "$count" != 1 ]; then
              echo "$path has $count lines matching its ciPins pattern instead of one" >&2
              exit 1
            fi
          done <<< "$pins"

      # The runner cannot build Sparxie or Silverwolf.
      - name: Build systems
        run: |
          set -euo pipefail
          for host in sparkle camellya kafka; do
            cache=desktop
            [ "$host" != sparkle ] || cache=server
            attr=".#nixosConfigurations.$host.config.system.build.toplevel"
            out=$(nix eval --raw --no-write-lock-file "$attr.outPath")
            if nix path-info --store "https://cache.lunaire.moe/$cache" "$out" > /dev/null 2>&1; then
              echo "$host is unchanged from a cached system: $out"
              continue
            fi
            nix build --no-link --no-write-lock-file "$attr"
          done
