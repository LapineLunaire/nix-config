name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
