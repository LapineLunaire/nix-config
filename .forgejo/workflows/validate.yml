name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    # Skips pull requests from forks, such as T3 Code's. A fork can change this file, so leaving its runs unapproved is what keeps its workflows off the shared runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Nix caches
        uses: ./.forgejo/actions/configure-nix

      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false

      # The runner cannot build Sparxie or Silverwolf.
      - name: Build systems
        id: build
        run: |
          set -euo pipefail
          for host in sparkle camellya kafka; do
            path=$(nix build --no-link --print-out-paths --no-write-lock-file ".#nixosConfigurations.$host.config.system.build.toplevel")
            echo "$host=$path" >> "$GITHUB_OUTPUT"
          done

      # Every commit on main gets cached, so a desktop that pulls it does not build it locally.
      - name: Push to the cache
        if: github.event_name == 'push'
        uses: ./.forgejo/actions/attic-push
        with:
          token: ${{ secrets.ATTIC_TOKEN }}
          server-paths: ${{ steps.build.outputs.sparkle }}
          desktop-paths: |
            ${{ steps.build.outputs.camellya }}
            ${{ steps.build.outputs.kafka }}
