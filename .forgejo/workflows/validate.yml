name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Nix caches
        uses: ./.forgejo/actions/configure-nix

      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false

      # The runner cannot build Sparxie or Silverwolf.
      - name: Build systems
        run: |
          set -euo pipefail
          for host in sparkle camellya kafka; do
            nix build --no-link --no-write-lock-file ".#nixosConfigurations.$host.config.system.build.toplevel"
          done
