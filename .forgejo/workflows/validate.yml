name: Validate

# The update workflow pushes with the workflow token, which starts no workflows; it checks and builds the same systems
# before it pushes.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A push waits for the run before it, so a long build still finishes. Without an explicit false, Forgejo cancels on push.
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the cache credential
        run: bash .forgejo/ci.sh check-cache

      - name: Check formatting
        run: bash .forgejo/ci.sh format

      - name: Evaluate all systems
        run: bash .forgejo/ci.sh check

      - name: Check the values CI may change
        run: bash .forgejo/ci.sh check-pins

      - name: Build uncached systems
        run: bash .forgejo/ci.sh build-uncached
