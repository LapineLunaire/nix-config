name: Push to the cache
description: Upload built systems to the server and desktop caches. A missing token fails the job.
inputs:
  token:
    description: Attic token that can push to both caches
    required: true
  server-paths:
    description: Store paths for the server cache, one per line
    required: true
  desktop-paths:
    description: Store paths for the desktop cache, one per line; may be empty
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Push to the cache
      shell: bash
      env:
        ATTIC_TOKEN: ${{ inputs.token }}
        SERVER_PATHS: ${{ inputs.server-paths }}
        DESKTOP_PATHS: ${{ inputs.desktop-paths }}
      run: |
        set -euo pipefail
        : "${ATTIC_TOKEN:?ATTIC_TOKEN is missing, so the cache cannot be filled}"
        mapfile -t server < <(printf '%s\n' "$SERVER_PATHS" | sed '/^$/d')
        mapfile -t desktop < <(printf '%s\n' "$DESKTOP_PATHS" | sed '/^$/d')
        # Protect Attic's cleartext token and remove it even on failure.
        umask 077
        export XDG_CONFIG_HOME
        XDG_CONFIG_HOME=$(mktemp -d "$RUNNER_TEMP/attic-config.XXXXXX")
        trap 'rm -rf -- "$XDG_CONFIG_HOME"' EXIT
        # attic login only takes the token as an argument, which other processes can read.
        mkdir "$XDG_CONFIG_HOME/attic"
        printf '%s' "$ATTIC_TOKEN" > "$XDG_CONFIG_HOME/attic/token"
        unset ATTIC_TOKEN
        printf '[servers.lunaire]\nendpoint = "https://cache.lunaire.moe/"\ntoken-file = "%s"\n' \
          "$XDG_CONFIG_HOME/attic/token" > "$XDG_CONFIG_HOME/attic/config.toml"
        attic push --ignore-upstream-cache-filter lunaire:server "${server[@]}"
        if [ "${#desktop[@]}" -gt 0 ]; then
          attic push --ignore-upstream-cache-filter lunaire:desktop "${desktop[@]}"
        fi
